<!DOCTYPE html>
<html dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Relicblade Deck Builder">
  <link rel="apple-touch-icon" href="./assets/icon512.png">
  <link rel="manifest" href="./manifest.json">

  <title>Relicblade Deck Builder</title>

  <link rel="stylesheet" type="text/css" href="./viewer.css">
  <link rel="stylesheet" type="text/css" href="./viewerHorizontal.css">
</head>

<body class="loading" showing="menu" displaytype="" listtype="" legal="" subfilter="">
  <main>
    <nav>
      <call class="control-border-horizontal">
        <edit></edit>
        <deckTitleContainer><input type="text" id="title" contentEditable="true" maxlength="24"
            placeholder="Untitled Deck" />
          <deckTitleMirror id="titleMirror">Untitled Deck</deckTitleMirror>
        </deckTitleContainer>
        <deckTitlePoints id="points"></deckTitlePoints>
      </call>
      <description class="horizontal"></description>
      <hamContainer>
        <share class="control-border-horizontal"></share>
        <ham class="control-border-horizontal"></ham>
      </hamContainer>
    </nav>

    <cardTopControls class="library vertical">
      <searchContainer>
        <input type="text" placeholder="Search text" />
        <searchIcon type="view"></searchIcon>
        <searchIcon type="clear"></searchIcon>
      </searchContainer>
      <cardControl class="library filterCharacter inactive"></cardControl>
      <cardControl type="character" class="library filterAdvocate inactive"></cardControl>
      <cardControl type="character" class="library filterAdversary inactive"></cardControl>
      <cardControl type="character" class="library filterNeutral inactive"></cardControl>
      <cardControl type="" class="library filterUpgrade inactive"></cardControl>
      <cardControl type="upgrade" class="library filterTactic inactive"></cardControl>
      <cardControl type="upgrade" class="library filterPotion inactive"></cardControl>
      <cardControl type="upgrade" class="library filterWeapon inactive"></cardControl>
      <cardControl type="upgrade" class="library filterItem inactive"></cardControl>
      <cardControl type="upgrade" class="library filterSpell inactive"></cardControl>
      <cardControl type="upgrade" class="library filterRelicUpgrade inactive"></cardControl>
      <cardControl type="" class="library filterRelic inactive"></cardControl>
    </cardTopControls>

    <cardScrollerContainer>
      <cardScroller class="library">
        <cardList>
        </cardList>
        <cardNameList>
        </cardNameList>
      </cardScroller>
      <cardScroller class="deck">
        <cardList>
          <add class="control-border"><label>Add Character</label></add>
        </cardList>
        <cardNameList>
          <add class="control-border"><label>Add Character</label></add>
        </cardNameList>
      </cardScroller>
    </cardScrollerContainer>

    <tokenContainer class="deck">
    </tokenContainer>

    <cardCarousel class="vertical_">
      <canvas></canvas>
    </cardCarousel>

    <cardButtons class="library_">
      <cardButton class="showDeck control-border">Return</cardButton>
      <cardButton class="grid control-border-flipped"></cardButton>
      <cardButton class="horizontal search control-border"></cardButton>
      <cardButton class="vertical horizontal addToDeck control-border">Add to<br>Deck</cardButton>
      <cardButton class="vertical horizontal attachUpgrade control-border">Attach<br>Upgrade</cardButton>
    </cardButtons>

    <cardButtons class="deck_">
      <cardButton class="vertical horizontal removeFromDeck control-border">Remove</cardButton>
      <cardButton class="vertical horizontal addUpgrade control-border">Add<br>Upgrade</cardButton>
      <cardButton class="vertical addCharacter control-border">Add<br>Character</cardButton>
      <cardButton class="showLibrary control-border">Show<br>Library</cardButton>
      <tokenButton>
      </tokenButton>
    </cardButtons>
  </main>

  <tokenOverlay class="hidden">
    <tokenExpander class="deck_">
      <token type="stun"></token>
      <token type="unconscious"></token>
      <token type="dodge"></token>
      <token type="bind"></token>
      <token type="poison"></token>
      <token type="shieldwall"></token>
    </tokenExpander>
  </tokenOverlay>

  <mainMenu>
    <menuLogo></menuLogo>
    <menuButtons>
      <menuButton class="learnToPlay control-border-flipped">Learn to Play</menuButton>
      <menuButton class="myLists control-border">My Lists</menuButton>
      <menuButton class="shareCodeInput control-border">Enter Share Code</menuButton>
      <menuButton class="libraryMode control-border-flipped">Browse</menuButton>
    </menuButtons>

    <savesMenu class="hidden">
      <menuButton class="saveSlot control-border" idx="0">
        <saveSlotLabel></saveSlotLabel>
        <saveSlotRename></saveSlotRename>
        <saveSlotDelete></saveSlotDelete>
      </menuButton>
      <menuButton class="saveSlot control-border-flipped" idx="1">
        <saveSlotLabel></saveSlotLabel>
        <saveSlotRename></saveSlotRename>
        <saveSlotDelete></saveSlotDelete>
      </menuButton>
      <menuButton class="saveSlot control-border" idx="2">
        <saveSlotLabel></saveSlotLabel>
        <saveSlotRename></saveSlotRename>
        <saveSlotDelete></saveSlotDelete>
      </menuButton>
      <menuButton class="saveSlot control-border" idx="3">
        <saveSlotLabel></saveSlotLabel>
        <saveSlotRename></saveSlotRename>
        <saveSlotDelete></saveSlotDelete>
      </menuButton>
      <menuButton class="saveSlot control-border-flipped" idx="4">
        <saveSlotLabel></saveSlotLabel>
        <saveSlotRename></saveSlotRename>
        <saveSlotDelete></saveSlotDelete>
      </menuButton>
      <menuButton class="saveReturn control-border">Back</menuButton>
    </savesMenu>
  </mainMenu>

  <loadingOverlay>
    <loading>
    </loading>
    <preview>
    </preview>
  </loadingOverlay>

  <overlayMenu class="hidden" showing="hamMenu">
    <hamMenu>
      <menuControl class="returnToMenu">Return To Main Menu</menuControl>
      <menuControl class="showList">Toggle Deck View: Cards</menuControl>
      <menuControl class="showCards">Toggle Deck View: List</menuControl>
      <menuControl class="showLegal">Toggle Illegal Options: Show</menuControl>
      <menuControl class="showIllegal">Toggle Illegal Options: Hide</menuControl>
      <label class="menuControl contact">Contact</label>
      <menuControl class="return">Return</menuControl>
    </hamMenu>
  </overlayMenu>

  <modalOverlay class="hidden">
    <cardContainer>
      <card></card>
    </cardContainer>
    <modal>
      <modalText></modalText>
      <modalButtons>
        <modalButton id="modalReturn" class="control-border-flipped">
          Return
        </modalButton>
        <modalButton id="modalAccept" class="control-border">
          Accept
        </modalButton>
      </modalButtons>
    </modal>
  </modalOverlay>

  <toast></toast>

  <templates>
    <card></card>
    <nameCard class="character">
      <upper>
        <activations></activations>
        <nameCardName></nameCardName>
        <points></points>
        <speed></speed>
        <armor></armor>
      </upper>
      <lower>
        <nameCardHealthBoxes></nameCardHealthBoxes>
      </lower>
      <upgradeContainer></upgradeContainer>
    </nameCard>
    <nameCard class="upgrade">
      <upper>
        <activations></activations>
        <nameCardName></nameCardName>
        <points></points>
      </upper>
      <nameCardHealthBoxes></nameCardHealthBoxes>
    </nameCard>
  </templates>

  <script src="./lib/capacitor.js"></script>
  <script type="module" src="./lib/navBar.plugin.js"></script>
  <script type="module" src="./lib/statusBar.plugin.js"></script>
  <script type="module" src="./lib/safeArea.plugin.js"></script>

  <script src="./lib/long-press-event.js"></script>

  <script type="module" src="./base.js"></script>
  <script src="./umd.js"></script>
</body>

</html>
